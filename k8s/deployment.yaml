apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-api
  labels:
    app: agentops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentops-api
  template:
    metadata:
      labels:
        app: agentops-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: agentops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: agentops-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-dashboard
  labels:
    app: agentops-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentops-dashboard
  template:
    metadata:
      labels:
        app: agentops-dashboard
    spec:
      containers:
        - name: dashboard
          image: agentops-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
